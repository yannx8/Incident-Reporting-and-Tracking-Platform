name: docs-agent

# Runs the Docs Agent (.agents/agents/docs-agent.md) after every merge to main.
on:
  push:
    branches: [main]

jobs:
  update-readme:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2 # need the pre-merge commit for a diff

      - name: Install Antigravity CLI
        run: curl -fsSL https://antigravity.google/install.sh | bash

      # CI auth: agy >= 1.1.13 can run against the Gemini API directly with
      # GEMINI_API_KEY, no interactive sign-in. Check `agy --version` if this
      # step errors — older CLI versions only support cached OAuth credentials.
      - name: Configure CI auth
        run: |
          mkdir -p ~/.gemini/antigravity-cli
          cat > ~/.gemini/antigravity-cli/settings.json <<'EOF'
          {
            "modelProvider": "gemini",
            "permissions": {
              "allow": ["command(git)", "write_file(README.md)", "write_file(CHANGELOG.md)"]
            }
          }
          EOF

      - name: Run docs-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          agy -p "A merge just landed on main (commit ${{ github.sha }}). Diff against the previous commit:

          $(git diff HEAD~1 HEAD)

          Review it per your instructions and update README.md / CHANGELOG.md only if the change is doc-relevant. Commit any changes to a new branch; do not push to main." \
            --agent docs-agent \
            --output-format json \
            --print-timeout 10m \
            > result.json
          cat result.json
          status=$(jq -r '.status' result.json)
          if [[ "$status" != "SUCCESS" ]]; then
            echo "::error::docs-agent run failed: $(jq -r '.error' result.json)"
            exit 1
          fi

      - name: Open PR if docs-agent made changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: docs/update-readme-${{ github.sha }}
          commit-message: "docs: update README after merge ${{ github.sha }}"
          title: "docs: update README after merge ${{ github.sha }}"
          body: |
            Automated documentation update from docs-agent after merge ${{ github.sha }}.
            Please review before merging.
