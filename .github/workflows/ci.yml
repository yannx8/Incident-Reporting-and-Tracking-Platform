name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: nexus_incidents
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus_dev
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus_incidents"
          --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: {version: 10}
      - uses: actions/setup-node@v4
        with: {node-version: 20, cache: pnpm}
      - run: pnpm install --frozen-lockfile=false
      - run: pnpm --filter backend prisma:generate
      - run: pnpm --filter backend prisma:migrate
        env:
          DATABASE_URL: postgresql://nexus:nexus_dev@localhost:5432/nexus_incidents
          JWT_SECRET: test
          JWT_REFRESH_SECRET: test-refresh
      - run: pnpm build
      - run: pnpm test
